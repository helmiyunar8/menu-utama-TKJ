<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Quiz 1 - Helmi Yunar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #D4AF37;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
            --dark-blue: #0f2a44;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

        body {
            background: linear-gradient(135deg, #0f2a44 0%, #1a4d8c 100%);
            background-attachment: fixed;
            color: var(--white);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* NAVBAR MEWAH */
        .navbar {
            background: var(--white);
            padding: 15px 5%;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar a {
            color: var(--dark-blue);
            text-decoration: none;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 50px;
            transition: 0.3s;
        }

        .navbar a:hover { background: #f0f0f0; color: var(--gold); }

        /* HEADER */
        .header-box {
            text-align: center;
            padding: 40px 20px;
        }
        .header-box i { font-size: 55px; color: var(--gold); margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(212,175,55,0.5)); }
        .header-box h1 { font-size: 35px; letter-spacing: 1px; font-weight: 900; }
        .header-box p { opacity: 0.8; font-weight: 300; margin-top: 5px; }

        /* CONTAINER RANKING */
        .leaderboard-container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
        }

        th {
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            padding: 10px 15px;
            color: var(--gold);
            text-align: left;
            opacity: 0.8;
        }

        td {
            padding: 18px 15px;
            background: rgba(255,255,255,0.05);
            transition: 0.3s ease;
        }

        /* Rounded Corners Baris */
        tr td:first-child { border-radius: 15px 0 0 15px; font-weight: 900; text-align: center; width: 70px; }
        tr td:last-child { border-radius: 0 15px 15px 0; font-weight: 800; text-align: center; color: var(--gold); font-size: 18px; }

        tr:hover td { background: rgba(255,255,255,0.12); transform: scale(1.02); }

        /* STYLE 3 BESAR */
        .rank-1 { background: linear-gradient(90deg, rgba(212,175,55,0.25), transparent) !important; border: 1px solid var(--gold) !important; }
        .rank-1 td:first-child { color: var(--gold); font-size: 24px; }
        .rank-1 td:nth-child(2) { font-weight: 700; font-size: 18px; }

        .rank-2 { background: linear-gradient(90deg, rgba(192,192,192,0.2), transparent) !important; }
        .rank-2 td:first-child { color: var(--silver); }

        .rank-3 { background: linear-gradient(90deg, rgba(205,127,50,0.2), transparent) !important; }
        .rank-3 td:first-child { color: var(--bronze); }

        /* LOADING ANIMATION */
        .loading-container { text-align: center; padding: 40px; }
        .loading-container i { font-size: 30px; margin-bottom: 10px; color: var(--gold); }

        .footer-link {
            display: inline-block;
            margin-top: 40px;
            color: var(--white);
            text-decoration: none;
            font-weight: 600;
            opacity: 0.7;
            transition: 0.3s;
            padding: 10px 20px;
            border-radius: 50px;
            background: var(--glass);
        }
        .footer-link:hover { opacity: 1; color: var(--gold); background: rgba(255,255,255,0.15); }

        @media (max-width: 500px) {
            .leaderboard-container { width: 95%; padding: 15px; }
            th, td { padding: 12px; font-size: 14px; }
            .header-box h1 { font-size: 28px; }
        }
    </style>

    <script>
        async function loadRanking(){
            const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqs-8lunzd77k36faD8j7x91EBYMbSRFViD5gB04kGdSmi4DCKPikzC4QqhotF2QjDkbmZm7i-R3OJ/pub?gid=1337124987&single=true&output=csv";

            try {
                const res = await fetch(url);
                const text = await res.text();
                const rows = text.trim().split("\n").slice(1);

                let data = rows.map(r => {
                    const c = r.split(/,|;/); 
                    return {
                        nama: c[0].replace(/"/g, ""),
                        nilai: parseInt(c[2]) || 0
                    };
                });

                data.sort((a,b) => b.nilai - a.nilai);

                let html = "";
                for(let i=0; i<data.length; i++){
                    let rowClass = "";
                    let icon = i + 1;

                    if(i === 0) { rowClass = "rank-1"; icon = "🥇"; }
                    else if(i === 1) { rowClass = "rank-2"; icon = "🥈"; }
                    else if(i === 2) { rowClass = "rank-3"; icon = "🥉"; }

                    html += `<tr class="${rowClass}">`;
                    html += `<td>${icon}</td>`;
                    html += `<td>${data[i].nama}</td>`;
                    html += `<td>${data[i].nilai}</td>`;
                    html += `</tr>`;
                }

                document.getElementById("ranking-body").innerHTML = html;
            } catch (error) {
                document.getElementById("ranking-body").innerHTML = "<tr><td colspan='3' style='text-align:center;'>Gagal memuat data. Silakan coba lagi.</td></tr>";
            }
        }
    </script>
</head>

<body onload="loadRanking()">

    <div class="navbar">
        <a href="index.html"><i class="fas fa-home"></i> BERANDA</a>
        <a href="materi.html"><i class="fas fa-book"></i> MATERI</a>
        <a href="tryout.html"><i class="fas fa-edit"></i> TRYOUT</a>
        <a href="absensi.html"><i class="fas fa-user-check"></i> ABSEN</a>
    </div>

    <div class="header-box">
        <i class="fas fa-trophy"></i>
        <h1>LEADERBOARD QUIZ 1</h1>
        <p>SMKN 7 LUWU • Jaringan Komputer & Telekomunikasi</p>
    </div>

    <div class="leaderboard-container">
        <table>
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Nama Lengkap</th>
                    <th>Skor</th>
                </tr>
            </thead>
            <tbody id="ranking-body">
                <tr>
                    <td colspan="3">
                        <div class="loading-container">
                            <i class="fas fa-spinner fa-spin"></i><br>
                            Mengambil data terbaru...
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div style="text-align: center;">
        <a href="index.html" class="footer-link">
            <i class="fas fa-chevron-left"></i> Kembali ke Dashboard
        </a>
    </div>

</body>
</html>
